<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - CampusCloud</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="profile-container">

    <h1 class="page-heading">✏ Edit Profile</h1>

    <div class="profile-card">

        <h2>Update Your Information</h2>

        <form method="POST">

            <div class="form-group">

                <label>
                    Name
                </label>

                <input type="text"
                       name="name"
                       value="{{ user.name }}"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       name="email"
                       value="{{ user.email }}"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Mobile No.
                </label>

                <input type="text"
                       name="mobile"
                       value="{{ user.mobile or '' }}"
                       maxlength="15">

            </div>


            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea name="address"
                          rows="4">{{ user.address or '' }}</textarea>

            </div>


            <button type="submit">
                💾 Save Changes
            </button>

        </form>

    </div>


    <div class="page-links">

        <a href="/profile">
            👤 Back to Profile
        </a>

        {% if user.role == 'teacher' %}

        <a href="/teacher_dashboard">
            🏠 Dashboard
        </a>

        {% else %}

        <a href="/dashboard">
            🏠 Dashboard
        </a>

        {% endif %}

        <a href="/logout">
            🚪 Logout
        </a>

    </div>

</div>

</body>
</html>
