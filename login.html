<!DOCTYPE html>
<html>
<head>
    <title>Login - CampusCloud</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<h1>CampusCloud</h1>

<h2>Student Login</h2>

<form method="POST">

    <input
        type="email"
        name="email"
        placeholder="Email Address"
        required>

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <br><br>

    <button type="submit">
        Login
    </button>

    <br><br>

    <p style="text-align:center;">
        Don't have an account?
        <a href="/register">Register Here</a>
    </p>

</form>

</body>
</html>
