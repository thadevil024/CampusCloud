<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard - Campus Cloud</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1 class="page-heading">
        👨‍💼 Staff Dashboard
    </h1>

    <div class="card">

        <h2>
            Welcome, {{ session.get('user_name', 'Staff') }} 👋
        </h2>

        <p>
            Welcome to the Campus Cloud Staff Portal.
        </p>

    </div>


    <!-- Staff Features -->

    <div class="dashboard-grid">

        <!-- Feature 2: Notices -->

        <div class="dashboard-card">

            <h2>📢</h2>

            <h3>Notices</h3>

            <p>
                View important college notices and updates.
            </p>

            <a href="/notice" class="btn">
                View Notices
            </a>

        </div>


        <!-- Feature 3: Profile -->

        <div class="dashboard-card">

            <h2>👤</h2>

            <h3>My Profile</h3>

            <p>
                View and edit your Staff profile information.
            </p>

            <a href="/profile" class="btn">
                Edit Profile
            </a>

        </div>


    </div>


    <!-- Navigation -->

    <div class="page-links">

        <a href="/">
            🏠 Home
        </a>

        <a href="/logout">
            🚪 Logout
        </a>

    </div>

</div>

</body>

</html>
