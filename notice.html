<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notice Board - Campus Cloud</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>📢 Notice Board</h1>

    <h2>Latest Notices</h2>

    <hr>

    {% if notices %}

    <div class="table-container">

        <table>

            <tr>
                <th>Title</th>
                <th>Content</th>
            </tr>

            {% for notice in notices %}

            <tr>
                <td>{{ notice.title }}</td>
                <td>{{ notice.content }}</td>
            </tr>

            {% endfor %}

        </table>

    </div>

    {% else %}

    <p class="empty-message">
        No notices available.
    </p>

    {% endif %}

    <br>

    <a href="/">🏠 Home</a>

    <a href="/login">🔐 Login</a>

    <a href="/register">📝 Register</a>

</div>

</body>

</html>
