<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Previous Year Papers</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>📄 Previous Year Papers</h1>

    <p>Upload previous year examination papers for students.</p>

    <hr>

    <div class="card">

        <h2>📤 Upload Paper</h2>

        <form method="POST" enctype="multipart/form-data">

            <label>Paper Title</label>
            <input type="text"
                   name="title"
                   placeholder="Paper Title"
                   required>

            <label>University</label>
            <input type="text"
                   name="university"
                   placeholder="University"
                   required>

            <label>Course</label>
            <input type="text"
                   name="course"
                   placeholder="Course"
                   required>

            <label>Branch</label>
            <input type="text"
                   name="branch"
                   placeholder="Branch"
                   required>

            <label>Semester</label>
            <input type="text"
                   name="semester"
                   placeholder="Semester"
                   required>

            <label>Subject</label>
            <input type="text"
                   name="subject"
                   placeholder="Subject"
                   required>

            <label>Exam Year</label>
            <input type="text"
                   name="exam_year"
                   placeholder="2023-24"
                   pattern="[0-9]{4}-[0-9]{2}"
                   title="Enter exam year in format 2023-24"
                   required>

            <label>Exam Type</label>
            <select name="exam_type">

                <option>Mid Semester</option>
                <option>End Semester</option>
                <option>Practical</option>
                <option>Other</option>

            </select>

            <label>Description</label>
            <textarea name="description"
                      placeholder="Description"
                      rows="4"></textarea>

            <label>Paper File (PDF)</label>
            <input type="file"
                   name="paper_file"
                   accept=".pdf"
                   required>

            <button type="submit">
                📤 Upload Paper
            </button>

        </form>

    </div>

    <div class="page-links">

        <a href="/teacher_dashboard">
            🏠 Teacher Dashboard
        </a>

        <a href="/profile">
            👤 Profile
        </a>

        <a href="/logout">
            🚪 Logout
        </a>

    </div>

</div>

</body>

</html>
